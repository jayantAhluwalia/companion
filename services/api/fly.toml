# Fly.io config for the companion API. One machine, always on, so the
# evaluator ticker (Phase 2) keeps running. Set secrets before first deploy:
#   fly secrets set API_TOKEN=... ANTHROPIC_API_KEY=...
app = "thought-companion-api"
primary_region = "lhr"

[build]

[env]
  PORT = "8080"
  ANTHROPIC_MODEL = "claude-opus-5-5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
