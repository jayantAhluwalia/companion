name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: companion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./... && go vet -tags db ./internal/store ./internal/telegram
      - name: Unit tests
        run: go test ./...
      - name: Database tests (every migration from scratch, the store's SQL, and who may touch what)
        run: go test -tags db ./internal/store ./internal/telegram -count=1
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/companion?sslmode=disable
